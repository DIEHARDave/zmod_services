# zmod_services' Moonraker part (install.sh includes it from
# mod_data/plugins.moonraker.conf). Lists Zmod's init.d services under
# Service Control in Mainsail/Fluidd's power menu.
#
# Built in: moonraker and nginx (restart only), helixscreen or
# guppyscreen (whichever Zmod is set to), camera, web_screen, orca_ff.
# Klipper is not in the list: Klipper Control in the same menu restarts
# it. Changes here need a Moonraker restart.
[zmod_services]
# Built-in services to leave out, e.g.:
#hide: orca_ff web_screen
#
# More services, one per line: name: init script in the chroot's
# /etc/init.d (or a full path), then the process(es) that show it is
# running (any part of its command line). Example:
#services:
#  myservice: S90myservice, /usr/bin/myservice
